name: CI

on:
  pull_request:
    branches:
      - dev

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "18"

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Build the project
        run: yarn build
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}

      - name: Start Vite server
        run: yarn preview > server.log 2>&1 &
        env:
          CI: true
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}

      - name: Wait for Vite server to start
        run: |
          npx wait-on http://localhost:3000 --timeout 60000 || (echo "Server log:" && cat server.log && exit 1)
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}

      - name: Debug Environment Variables
        run: echo "VITE_BASE_URL=${{ secrets.VITE_BASE_URL }}"
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}

      - name: Run Cypress tests
        run: yarn test:cy
        env:
          CI: true
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
